[project]
name = "auto-llm-predictor"
version = "0.3.0"
description = "Automatic LLM predictor builder using LangGraph"
authors = [
    { name = "Qingtian Zou" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "openai>=2.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
train = [
    "llamafactory>=0.9",
]
webui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.7",
]
xai = [
    "shap>=0.42",
    "transformer-lens>=2.0",
    "matplotlib>=3.5",
]

[project.scripts]
auto-llm-predictor = "auto_llm_predictor.main:main"
auto-llm-predictor-webui = "auto_llm_predictor.webui:main"
auto-llm-predictor-infer = "auto_llm_predictor.inference:main"
auto-llm-predictor-xai = "auto_llm_predictor.xai:main"
